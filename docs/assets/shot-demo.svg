<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-label="Placeholder screenshot — Sandbox Demo">
  <title>Placeholder — Sandbox Demo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1c"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#8b93ff" opacity="0.10"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="760" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="760" rx="18" fill="url(#dots)"/>
  <rect x="18" y="18" width="1244" height="724" rx="14" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.55"/>

  <g transform="translate(640,300)" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.85">
    <rect x="-70" y="-52" width="140" height="104" rx="12"/>
    <circle cx="-32" cy="-18" r="12"/>
    <path d="M-70,32 L-18,-6 L18,22 L70,-24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="640" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e5e7eb">Sandbox Demo</text>
  <text x="640" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3c0">The 3-step crash -> confess -> resolve loop, step 3 resolved</text>

  <g transform="translate(640,520)">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="#0f1424" stroke="#3b4270" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c7d2fe">demo.html  (after completing all 3 steps — the green "Resolved" card)</text>
  </g>

  <g transform="translate(640,66)">
    <rect x="-92" y="-16" width="184" height="32" rx="16" fill="#1c0f16" stroke="#fb7185" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fda4af" letter-spacing="1.5">PLACEHOLDER</text>
  </g>
